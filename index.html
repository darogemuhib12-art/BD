<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c9a7ff">
<meta name="mobile-web-app-capable" content="yes">
<title>The Birthday Kingdom</title>
<style>
:root{
  --pink:#ffc8dd; --rose:#e76f9a; --rose-d:#b8446f; --lav:#cdb4db; --lav-d:#8e6bb3;
  --blue:#bde0fe; --cream:#fff8f0; --gold:#f5c76b; --gold-d:#c9952c;
  --ink:#3d2340; --ink-soft:#6b4a6e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e9d8f5;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden}
#view{position:absolute;inset:0;z-index:1}
#view > *{position:absolute;inset:0}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
.hide{display:none !important}

/* ---------- Buttons ---------- */
.btn{appearance:none;border:0;font-weight:800;font-size:clamp(1rem,4.4vw,1.15rem);color:#fff;
  min-height:56px;padding:14px 22px;border-radius:999px;line-height:1.2;
  background:linear-gradient(180deg,#f7a1c1,#e0628f);
  box-shadow:0 5px 0 #b8446f,0 10px 20px rgba(120,40,80,.22);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  text-shadow:0 1px 0 rgba(0,0,0,.15);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b8446f,0 4px 10px rgba(120,40,80,.22)}
.btn.gold{background:linear-gradient(180deg,#ffe49a,#f2b84b);color:#5a3a10;text-shadow:none;box-shadow:0 5px 0 #c9952c,0 10px 20px rgba(140,90,20,.25)}
.btn.gold:active{box-shadow:0 1px 0 #c9952c}
.btn.lav{background:linear-gradient(180deg,#dcc8f3,#a888d0);box-shadow:0 5px 0 #7e5ea8,0 10px 20px rgba(80,50,120,.22)}
.btn.lav:active{box-shadow:0 1px 0 #7e5ea8}
.btn.ghost{background:rgba(255,255,255,.92);color:var(--ink);text-shadow:none;box-shadow:0 4px 0 rgba(170,120,170,.5),0 8px 16px rgba(80,40,90,.15)}
.btn.ghost:active{box-shadow:0 1px 0 rgba(170,120,170,.5)}
.btn.small{min-height:50px;padding:10px 16px;font-size:1rem}
.btn.big{min-height:62px;font-size:clamp(1.08rem,4.8vw,1.25rem)}
.btn:focus-visible,.pill:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pill{appearance:none;border:0;min-height:48px;min-width:48px;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.92);color:var(--ink);font-weight:800;font-size:1rem;
  box-shadow:0 3px 10px rgba(60,20,60,.18);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill:active{transform:scale(.95)}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);
  font-weight:800;font-size:1rem;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(60,20,60,.15);white-space:nowrap}

/* ---------- Top bar & common layout ---------- */
.topbar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:8px;
  padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 8px calc(12px + var(--sal));pointer-events:none}
.topbar > *{pointer-events:auto}
.topbar .ttl{flex:1;min-width:0;text-align:center;font-family:var(--serif);font-weight:700;color:#fff;
  text-shadow:0 2px 6px rgba(60,20,60,.55);font-size:clamp(.95rem,4.2vw,1.15rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.stage{position:absolute;inset:0;overflow:hidden}
.stage.play{touch-action:none}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.action-area{position:absolute;left:0;right:0;bottom:calc(26px + var(--sab));z-index:7;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.action-area .btn{pointer-events:auto;animation:bounceIn .5s ease-out}
.banner{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(70px + var(--sat));
  width:calc(100% - 28px - var(--sal) - var(--sar));max-width:520px;background:rgba(255,250,246,.95);border-radius:18px;
  padding:10px 14px;font-weight:700;font-size:clamp(.95rem,4vw,1.08rem);line-height:1.35;color:var(--ink);
  box-shadow:0 6px 18px rgba(40,20,60,.2);display:flex;align-items:center;gap:10px}
.banner .mini{flex:0 0 40px;width:40px;height:40px}
.banner.bad{animation:shake .4s}

/* ---------- Dialogue ---------- */
#dlgLayer{position:fixed;left:0;right:0;bottom:0;top:calc(66px + var(--sat));z-index:20;display:none}
#dlgLayer.on{display:block}
.dlg{position:absolute;left:calc(12px + var(--sal));right:calc(12px + var(--sar));bottom:calc(18px + var(--sab));margin:0 auto;max-width:560px;
  background:linear-gradient(180deg,#fffaf6,#fff0f6);border:3px solid #f6bfd5;border-radius:24px;
  padding:22px 18px 12px;box-shadow:0 12px 30px rgba(60,20,60,.3)}
.dlg.pop{animation:pop .3s ease-out}
.dlg .who{position:absolute;top:-19px;left:18px;background:var(--lav-d);color:#fff;font-weight:800;
  padding:6px 14px;border-radius:999px;font-size:.95rem;box-shadow:0 3px 8px rgba(60,20,90,.25)}
.dlg .who.muhib{background:var(--rose-d)}
.dlg .who.sara{background:#d27aa0}
.dlg .ava{float:left;width:58px;height:58px;margin:0 12px 4px 0}
.dlg .ava svg{width:100%;height:100%}
.dlg .txt{font-size:clamp(1.03rem,4.5vw,1.2rem);line-height:1.5;color:var(--ink);min-height:3em}
.dlg .more{clear:both;text-align:right;font-size:.92rem;color:var(--rose-d);font-weight:800;margin-top:4px;animation:nudge 1s infinite}

/* ---------- Modal ---------- */
#modalLayer{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,20,55,.55);
  padding:calc(16px + var(--sat)) calc(14px + var(--sar)) calc(16px + var(--sab)) calc(14px + var(--sal))}
#modalLayer.on{display:flex}
.card{position:relative;width:100%;max-width:480px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:var(--cream);border-radius:26px;padding:24px 20px 20px;box-shadow:0 20px 50px rgba(40,10,50,.4);animation:pop .3s ease-out;
  border:3px solid #f6d3e2}
.card h2{font-family:var(--serif);color:var(--rose-d);margin:2px 0 12px;font-size:clamp(1.3rem,6vw,1.6rem);text-align:center;padding:0 44px;line-height:1.2}
.card .x{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:0;background:#f7e1ec;color:var(--ink);font-size:1.3rem;font-weight:800}
.card .x:active{transform:scale(.92)}
.card .body{font-size:clamp(1rem,4.3vw,1.1rem);line-height:1.55}
.card .actions{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.center{text-align:center}
.bigtxt{font-size:clamp(1.08rem,4.8vw,1.25rem);font-weight:700}
.howto{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.howto li{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 12px;border:2px solid #f6e0ea}
.howto li span:first-child{font-size:1.5rem;line-height:1.2}
.letter{background:#fffaf0;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 31px,rgba(214,170,190,.28) 31px,rgba(214,170,190,.28) 32px);
  border:1px solid #f0d9c0;border-radius:14px;padding:16px 16px 18px;font-family:var(--serif);font-size:clamp(1.05rem,4.5vw,1.15rem);
  line-height:32px;white-space:pre-line;color:#4a2a3a;user-select:text;-webkit-user-select:text}
.letter .sign{text-align:right;font-style:italic;color:var(--rose-d);margin-top:8px}
.gift-big{width:120px;height:120px;margin:0 auto;animation:bounceIn .6s ease-out}
.gift-big svg{width:100%;height:100%}
.gift-name{font-family:var(--serif);text-align:center;color:var(--ink);margin:8px 0 4px;font-size:1.3rem}
.gift-desc{text-align:center;color:var(--ink-soft);margin:0}
.dots{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.dots span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:#eee3f2;border:2px solid #fff;box-shadow:0 2px 6px rgba(60,20,60,.12)}
.dots span.on{background:#ffe49a}

/* ---------- Toast & veil ---------- */
#toast{position:fixed;left:50%;top:calc(74px + var(--sat));transform:translate(-50%,-16px);opacity:0;z-index:40;
  background:rgba(61,35,64,.94);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:1rem;
  width:max-content;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s,transform .3s;pointer-events:none;line-height:1.4}
#toast.on{opacity:1;transform:translate(-50%,0)}
#veil{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,#fff3f8,#e6d3f6);opacity:0;pointer-events:none;
  transition:opacity .35s;display:flex;align-items:center;justify-content:center}
#veil.on{opacity:1;pointer-events:auto}
#veil .vh{font-size:3rem;animation:floaty .8s ease-in-out infinite alternate}

/* ---------- Title ---------- */
.title{background:linear-gradient(180deg,#b6a2ea 0%,#efb5d3 42%,#ffdfe9 72%,#fff1e4 100%);overflow:hidden}
.title-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:52%;display:block}
.title-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(18px + var(--sat)) calc(18px + var(--sar)) calc(22px + var(--sab)) calc(18px + var(--sal));overflow-y:auto;touch-action:pan-y}
.ttl-head{text-align:center;margin-top:2vh;position:relative}
.crown-ico{width:62px;height:62px;margin:0 auto 4px;animation:floaty 2.2s ease-in-out infinite alternate}
.title h1{font-family:var(--serif);font-size:clamp(2.1rem,10.5vw,3.5rem);line-height:1.02;margin:0;color:#fff;letter-spacing:.04em;
  text-shadow:0 3px 0 #d77fa6,0 6px 18px rgba(140,60,120,.45)}
.title h1 small{display:block;font-size:.38em;letter-spacing:.4em;color:#fff6d8;margin-bottom:4px}
.title .sub{font-size:clamp(1rem,4.5vw,1.2rem);color:#4e2552;margin:14px 0 4px;font-weight:700}
.title .by{font-family:var(--serif);font-style:italic;color:#6e2f60;font-size:clamp(1rem,4.4vw,1.15rem);margin:0}
.menu{display:flex;flex-direction:column;gap:14px;width:100%;max-width:350px;margin-top:18px;
  background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:28px;padding:16px;border:2px solid rgba(255,255,255,.6)}
.menu .row{display:flex;gap:12px}
.menu .row .btn{flex:1;padding-left:10px;padding-right:10px}
.save-note{font-size:.88rem;text-align:center;color:#5a2d5c;margin:0;font-weight:600}
@media (orientation:landscape) and (max-height:560px){
  .title-inner{flex-direction:row;justify-content:center;align-items:center;gap:28px}
  .ttl-head{margin-top:0}
  .title h1{font-size:clamp(1.8rem,6vw,2.6rem)}
  .menu{margin-top:0;gap:10px;padding:12px}
  .menu .btn{min-height:50px}
}

/* ---------- Map ---------- */
.mapbg{background:linear-gradient(180deg,#d9cdf6,#fbe3ef 55%,#e4f5e9)}
.node{cursor:pointer}
.node .nicon{font-size:30px;text-anchor:middle;pointer-events:none}
.node .nlabel{font-size:13px;font-weight:800;fill:#4a2c4f;text-anchor:middle;pointer-events:none;font-family:system-ui,sans-serif}
.node.locked .base{opacity:.75}
.node.shake{animation:shake .4s;transform-box:fill-box;transform-origin:center}
.bottombar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:12px;justify-content:center;
  padding:10px calc(14px + var(--sar)) calc(16px + var(--sab)) calc(14px + var(--sal))}
.bottombar .btn{flex:1;max-width:220px}

/* ---------- SVG scene bits ---------- */
.ring{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:3;stroke-dasharray:7 6;transform-box:fill-box;transform-origin:center;animation:ringpulse 1.6s ease-in-out infinite}
.spot.seen .ring{stroke-dasharray:none;opacity:.45;animation:none}
.spot.hint .ring{stroke:#ffd36e;stroke-width:5;animation:ringpulse .8s ease-in-out infinite}
.slabel{font-size:13px;font-weight:800;fill:#4a2552;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none;font-family:system-ui,sans-serif}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.drift{animation:drift 9s ease-in-out infinite alternate}
.floaty{animation:floaty 2.2s ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
.shimmer{animation:shimmer 3s ease-in-out infinite}
.walking .bob{animation:bob .28s ease-in-out infinite alternate}
.smoke{animation:smoke 3.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
.star-in{opacity:0;transform-box:fill-box;transform-origin:center}
#gstar.show .star-in{animation:rise .9s ease-out forwards}
#gstar.fly{transition:transform .8s ease-in,opacity .8s;transform:translate(0,-420px) scale(.3);opacity:0}
.lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
#chest.open .lid{transform:rotate(-38deg) translate(-4px,-6px)}
#chest .cglow{opacity:0;transition:opacity .6s}
#chest.open .cglow{opacity:1}
.appear{animation:bounceIn .7s ease-out;transform-box:fill-box;transform-origin:50% 50%}
.doorL,.doorR{transform-box:fill-box;transition:transform 1.2s ease-in-out}
.doorL{transform-origin:0% 50%}.doorR{transform-origin:100% 50%}
.opened .doorL,.opened .doorR{transform:scaleX(.08)}
.cstar .core{transition:r .25s,fill .25s}
.cstar.on .core{fill:#ffd36e}
.cstar .num{font-size:15px;font-weight:900;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#2a2a60;stroke-width:4px;pointer-events:none;font-family:system-ui,sans-serif}
.cstar.on .num{fill:#ffe9a8}
.cstar.next .halo{stroke:#ffd36e;stroke-width:3;stroke-dasharray:5 5;fill:none;transform-box:fill-box;transform-origin:center;animation:ringpulse 1s infinite}
.cstar.bad{animation:shake .4s;transform-box:fill-box;transform-origin:center}
.cstar .xmark{opacity:0;transition:opacity .2s}
.cstar.bad .xmark{opacity:1}
.cline{stroke:#fff3c4;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .45s ease-out}
.heartfill{opacity:0;transition:opacity 1.4s}
.done .heartfill{opacity:1}

/* ---------- Festival game ---------- */
.dim{position:absolute;inset:0;background:rgba(60,30,80,.35);opacity:0;transition:opacity .5s;pointer-events:none}
.dim.on{opacity:1}
.game-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}
.hud{position:absolute;z-index:6;top:calc(68px + var(--sat));left:calc(12px + var(--sal));right:calc(12px + var(--sar));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud .hrow{display:flex;justify-content:space-between;gap:8px}
.hud .chip{font-size:clamp(1rem,4.4vw,1.15rem)}
.hud .chip.warn{background:#ffe0e8;animation:pulse .6s infinite alternate}
.pbar{height:14px;border-radius:999px;background:rgba(255,255,255,.6);overflow:hidden;border:2px solid rgba(255,255,255,.9)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ec4,#ffd36e);border-radius:999px;transition:width .25s}
.countdown{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--serif);font-size:clamp(4rem,24vw,7rem);font-weight:700;color:#fff;text-shadow:0 4px 0 #e0628f,0 8px 24px rgba(80,20,60,.5)}
.countdown span{animation:countpop .9s ease-out forwards}

/* ---------- Memory cards ---------- */
.forestbg{background:linear-gradient(180deg,#2b2457,#463a7a 55%,#3b3266)}
.mem-ui{position:absolute;z-index:4;left:0;right:0;top:calc(66px + var(--sat));bottom:0;display:flex;flex-direction:column;align-items:center;
  padding:6px calc(12px + var(--sar)) calc(16px + var(--sab)) calc(12px + var(--sal));gap:10px}
.mem-head{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mem-area{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.grid{display:grid;gap:10px}
.mcard{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;perspective:700px}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in,.mcard.ok .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mcard .b{background:linear-gradient(140deg,#a487d0,#6d5aa8);border:3px solid #e9dcff;box-shadow:0 6px 14px rgba(10,0,40,.35)}
.mcard .b svg{width:56%;height:56%;opacity:.95}
.mcard .f{transform:rotateY(180deg);background:#fffaf2;border:3px solid #f5c76b;box-shadow:0 6px 14px rgba(10,0,40,.3)}
.mcard .ico{font-size:clamp(1.7rem,8.5vw,2.6rem);line-height:1}
.mcard .lbl{font-size:clamp(.72rem,3.2vw,.9rem);font-weight:800;color:var(--ink)}
.mcard.ok .f{border-color:#6cc784;box-shadow:0 0 0 3px rgba(108,199,132,.5),0 0 20px rgba(255,246,176,.9)}
.mcard.ok .f::after{content:"✓";position:absolute;top:4px;right:8px;color:#2f8f46;font-weight:900;font-size:1rem}
.mcard.bad .in{animation:cardshake .45s}
.mcard.bad .f{border-color:#f08aa0}

/* ---------- Lake ---------- */
.lakebg{background:linear-gradient(180deg,#1f2156,#3a3d86 50%,#2e3a73)}
.hintbtn{position:absolute;z-index:7;right:calc(14px + var(--sar));bottom:calc(22px + var(--sab))}

/* ---------- Castle / cake ---------- */
.castlebg{background:linear-gradient(180deg,#8f7ad8,#f0a8cb 55%,#ffd9c2)}
.hall{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 60%,#fff2df 0%,#f7c6dc 45%,#a98bd6 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:calc(70px + var(--sat)) calc(16px + var(--sar)) calc(20px + var(--sab)) calc(16px + var(--sal));animation:fadein .8s}
.hall h2{font-family:var(--serif);color:#7a2a5c;margin:0;font-size:clamp(1.4rem,6.5vw,1.9rem);text-align:center;text-shadow:0 2px 0 #fff}
.hall p{margin:0;text-align:center;font-weight:700;color:#5a2d5c;font-size:clamp(1rem,4.3vw,1.12rem);max-width:420px}
.cake{position:relative;width:min(86vw,44vh,400px);aspect-ratio:1/1;flex:0 0 auto}
.cake > svg{position:absolute;inset:0;width:100%;height:100%}
.candle{position:absolute;border:0;padding:0;background:none}
.candle .stick{position:absolute;left:32%;width:36%;bottom:0;height:57%;border-radius:4px;
  background:repeating-linear-gradient(135deg,#fff 0 6px,#ff9ec4 6px 12px);box-shadow:inset -2px 0 0 rgba(0,0,0,.08)}
.candle .flame{position:absolute;left:26%;width:48%;top:4%;height:32%;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 72%,#fffbe0 0 22%,#ffd36e 45%,#ff8a3d 78%,rgba(255,138,61,0) 80%);
  box-shadow:0 0 16px 6px rgba(255,200,90,.55);transform-origin:50% 100%;animation:flicker .16s ease-in-out infinite alternate;transition:opacity .25s,transform .25s}
.candle.out .flame{opacity:0;transform:scale(.2);animation:none}
.candle .puff{position:absolute;left:30%;top:12%;width:40%;height:22%;border-radius:50%;background:rgba(230,225,240,.9);opacity:0;pointer-events:none}
.candle.out .puff{animation:smoke 1.4s ease-out forwards}
.hall-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

let reduceMotion = false;

function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

/* ---------------- Save system ---------------- */
const SAVE_KEY = 'birthdayKingdom.forSara.v1';
const Store = {
  ok: false,
  init() { try { const k = '__bk_test'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); this.ok = true; } catch (e) { this.ok = false; } },

function freshState(sound) {
  return { v:1, started:false, done:{1:false,2:false,3:false,4:false,5:false}, ch1:{ star:false },
    stars:0, gifts:[], letters:['l0'], progress:0,
    scores:{ festival:0, memoryMoves:0, constellation:false }, sound: sound !== false };
}
let state = freshState(true);

function recompute(s) {
  s = s || state;
  for (let n = 2; n <= 5; n++) if (!s.done[n - 1]) s.done[n] = false;   // no impossible chapter states
  if (s.done[1]) s.ch1.star = true;

}

    for (let n = 1; n <= 5; n++) f.done[n] = !!(raw.done && raw.done[n]);

}
function save() { recompute(); return Store.save(state); }
function hasProgress() { return !!state.started; }
function doneCount() { return [1, 2, 3, 4, 5].filter(n => state.done[n]).length; }
function unlocked(n) { if (n === 1) return true; if (n === 5) return state.done[1] && state.done[2] && state.done[3] && state.done[4]; return !!state.done[n - 1]; }

/* ---------------- Sound (Web Audio, created only after a tap) ---------------- */
const Sound = {

/* ---------------- Particles / effects canvas ---------------- */
const FX = (() => {

  }

  function next() {
    if (typing) { clearInterval(timer); txtEl.textContent = chars.join(''); typing = false; return; }

    show(lines.shift());
  }

  return {
    run(arr, cb) { lines = arr.slice(); done = cb || null; active = true; lastTap = Date.now(); layer.classList.add('on'); box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); next(); },

  function close() { if (!open) return; const cb = onClose; closeSilently(); if (cb) cb(); }

    if (closable) { const x = el('button', 'x', '✕'); x.setAttribute('aria-label', 'Close'); x.addEventListener('click', () => { if (Date.now() - shownAt < 350) return; close(); }); card.appendChild(x); }

  ${balloon(52, 330, '#ff9ec4', 0)}${balloon(86, 380, '#ffd36e', 1)}${balloon(352, 320, '#c9a7ff', .5)}${balloon(318, 384, '#9fd3f0', 1.5)}
  ${castleG(200, 612, 1.12)}
  ${hills(615, 18, '#f7cfe0', 0)}${hills(650, 14, '#c9ecd2', 1)}
  ${fl}
</svg>`;
}
SCENES.ch5 = () => {
  const T = timers();
  if (!unlocked(5)) {
    const root = el('div', 'stage castlebg');
    return { root, enter() { toast('The castle wakes up after the other four chapters 🔒'); go('map'); } };
  }
  const replay = state.done[5]; let blown = 0, celebrated = false;
  const root = el('div', 'stage castlebg');
  root.innerHTML = topbarHTML('🎂 The Birthday Castle') + castleSceneSVG() + `<div class="action-area"></div>`;
  const svg = $('svg', root), action = $('.action-area', root);
  function enterCastle() {
    action.innerHTML = ''; svg.classList.add('opened'); Sound.play('whoosh'); Sound.play('sparkle');
    const c = toScreen(svg, 200, 560); FX.burst(c.x, c.y, 26);
    T.set(showHall, reduceMotion ? 300 : 1400);
  }
  function showHall() {
    const xs = [90, 120, 150, 180, 210];
    const hall = el('div', 'hall');
    hall.innerHTML = `<h2>Make a wish, Sara 💭</h2><p>Close your eyes, make a wish, then tap each candle to blow it out.</p>
      <div class="cake">${cakeSVG()}${xs.map((x, i) => `<button class="candle" data-c="${i}" aria-label="Candle ${i + 1}" style="left:${((x - 15) / 3).toFixed(2)}%;top:6.67%;width:10%;height:24%"><span class="stick"></span><span class="flame"></span><span class="puff"></span></button>`).join('')}</div>
      <div class="hall-row"><button class="btn ghost" data-a="blowall">🌬️ Blow them all</button></div>`;
    root.appendChild(hall); FX.setAmbient(1.2, 'hearts'); Sound.play('chime');
  }
  function blow(btn) {
    if (!btn || btn.classList.contains('out') || celebrated) return;
    btn.classList.add('out'); btn.setAttribute('aria-label', 'Candle blown out'); Sound.play('puff'); vibrate(15); blown++;
    if (blown >= 5) { celebrated = true; const b = $('[data-a="blowall"]', root); if (b) b.disabled = true; T.set(celebrate, 700); }
  }
  function fireworks(sec) {
    const W = innerWidth, H = innerHeight; let n = 0; const max = Math.round(sec / 0.65);
    FX.confetti(90); FX.hearts(26);
    const id = T.every(() => { FX.firework(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * 0.42)); if (n % 2 === 0) Sound.play('boom'); if (++n >= max) T.stop(id); }, reduceMotion ? 1200 : 650);
  }
  function celebrate() {
    const first = !state.done[5]; completeChapter(5);
    const hall = $('.hall', root); if (hall) hall.style.visibility = 'hidden';
    const fin = el('div', 'finale');
    fin.innerHTML = `<div class="hb-cake" aria-hidden="true">🎂</div><div class="hb">Happy Birthday,<br>Sara!</div>
      <p class="fsub">The whole Birthday Kingdom is celebrating you today — every star, every lantern and every flower. 💗</p>
      <div class="shelf" aria-label="Your gifts">${GIFTS.map(g => `<div title="${g.name}">${ICONS[g.id]}</div>`).join('')}</div>
      <div class="fbtns"><button class="btn gold big" data-a="letter">💌 Read Muhib’s Final Letter</button>
      <button class="btn lav" data-a="fgifts">🎁 See All My Gifts</button><button class="btn lav" data-a="fmem">📜 All My Memories</button>
      <button class="btn ghost" data-a="again">🎆 Celebrate Again</button><button class="btn ghost" data-a="tomap">🗺️ Back to the Kingdom Map</button></div>`;
    root.appendChild(fin); fireworks(9); Sound.birthdaySong(); vibrate([40, 60, 40]);
    if (first || !replay) T.set(() => { if (!Modal.open) readFinal(); }, 3600);
  }
  function readFinal() {
    showLetter(LETTERS[5], () => Dialog.run([L('Happy birthday, Sara. Thank you for playing in our little kingdom 💗'), L('Muhib made all of this just for you. I really hope it made you smile!')]));
  }
  root.addEventListener('click', e => {
    const c = e.target.closest('.candle'); if (c) { blow(c); return; }
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    if (a === 'back' || a === 'tomap') go('map');
    else if (a === 'enter') enterCastle();
    else if (a === 'blowall') { $$('.candle:not(.out)', root).forEach((btn, i) => T.set(() => blow(btn), i * 230)); }
    else if (a === 'letter') readFinal();
    else if (a === 'fgifts') go('gifts', { from:'map' });
    else if (a === 'fmem') go('memories', { from:'map' });
    else if (a === 'again') { fireworks(6); Sound.birthdaySong(); }
  });
  return { root, amb:1, ambKind:'mix',
    enter() {
      const lines = replay ? [L('Welcome back to your castle, Sara 👑'), L('The cake has been magically relit. Shall we celebrate again?')] : [
        L('Sara… look! The Birthday Castle is waking up! 🏰'),
        L('The star, the wishes, the memories and the constellation — you brought them all back.'),
        L('Everyone in the kingdom is waiting inside for you. Ready?')];
      Dialog.run(lines, () => { action.innerHTML = `<button class="btn gold big" data-a="enter">🏰 Enter the Castle</button>`; });
    },
    cleanup() { T.clear(); }
  };
};

/* ---------------- Start-up ---------------- */
function boot() {
  Store.init(); state = loadState(); FX.resize();
  let rt = 0; const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { FX.resize(); fitSVGs(); if (curScene && curScene.resize) { try { curScene.resize(); } catch (e) {} } }, 120); };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) FX.start();
    else if (Sound.ctx && Sound.ctx.state === 'running') { try { Sound.ctx.suspend(); } catch (e) {} }
  });
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.closest('.mcard') && !b.classList.contains('candle') && !b.classList.contains('node')) Sound.play('tap'); }, true);
  document.addEventListener('contextmenu', e => { if (!e.target.closest('.letter')) e.preventDefault(); });
  document.addEventListener('touchmove', e => { if (!e.target.closest('.card, .page-body, .title-inner, .finale')) e.preventDefault(); }, { passive:false });
  window.__bk = { get state() { return state; }, go, get scene() { return current; } };
  go('title');
  if (window.innerWidth > window.innerHeight && window.innerHeight < 560) setTimeout(() => toast('Tip: hold your phone upright for the best view 💗', 3500), 1200);
}
try { boot(); }
catch (err) {
  console.error(err);
  document.getElementById('veil').innerHTML = '<div style="padding:24px;text-align:center;font-size:1.15rem;max-width:420px">💗<br>The kingdom needs a newer browser to open. Please try opening this gift in Google Chrome.</div>';
}
})();
</script>
